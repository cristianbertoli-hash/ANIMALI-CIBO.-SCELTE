name: Temporary MEDLAB v0.4 delivery

on:
  push:
    branches: ["temp-medlab-v04-delivery-20261030"]
    paths:
      - "_temporary_delivery/**"
      - ".github/workflows/temp-medlab-v04-delivery.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify APK SHA-256
        shell: bash
        run: |
          set -euo pipefail
          echo "b582a50b986eb84a7a7f376c5672043707a5c6c1facf1c70858a69264cb879b0  _temporary_delivery/MEDLAB-Care-v0.4.apk" | sha256sum -c -
      - name: Upload temporary artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MEDLAB-Care-v0.4-direct
          path: _temporary_delivery/MEDLAB-Care-v0.4.apk
          retention-days: 1
          compression-level: 0
      - name: Publish temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="medlab-v0.4-delivery-20261030"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "_temporary_delivery/MEDLAB-Care-v0.4.apk" \
            --title "MEDLAB Care v0.4 temporary delivery" \
            --notes "Temporary delivery asset for MEDLAB Care v0.4."
